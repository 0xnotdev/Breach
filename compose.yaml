services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: breach
      POSTGRES_USER: breach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breach -d breach"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [metadata]
    volumes: [metadata:/var/lib/postgresql/data]

  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    entrypoint: ["node", "apps/api/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://breach:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/breach
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [metadata]

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://breach:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/breach
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?set OPERATOR_TOKEN}
      API_PORT: 8080
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ulimits:
      nofile: 256
      core: 0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    init: true
    restart: unless-stopped
    networks: [metadata]

  egress-proxy:
    build:
      context: .
      dockerfile: deploy/egress-proxy.Dockerfile
    environment:
      EGRESS_PROXY_PORT: 3128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3128/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    restart: unless-stopped
    networks: [proxy_control, egress]

  worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://breach:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/breach
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN}
      FINGERPRINT_HMAC_KEY: ${FINGERPRINT_HMAC_KEY:?set FINGERPRINT_HMAC_KEY}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-30000}
      WORKER_HEALTH_PORT: 8081
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: postgres,api,web,127.0.0.1,localhost
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile: 256
      core: 0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    init: true
    restart: unless-stopped
    networks: [metadata, proxy_control]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8080
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?set OPERATOR_TOKEN}
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ulimits:
      nofile: 256
      core: 0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    init: true
    restart: unless-stopped
    networks: [metadata]

networks:
  metadata:
    internal: true
  proxy_control:
    internal: true
  egress: {}

volumes:
  metadata: {}
