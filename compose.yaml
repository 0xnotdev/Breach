services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: breach
      POSTGRES_USER: breach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breach -d breach"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [metadata]
    volumes: [metadata:/var/lib/postgresql/data]

  worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://breach:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/breach
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN}
      FINGERPRINT_HMAC_KEY: ${FINGERPRINT_HMAC_KEY:?set FINGERPRINT_HMAC_KEY}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile: 256
      core: 0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    init: true
    restart: unless-stopped
    networks: [metadata, egress]

networks:
  metadata:
    internal: true
  egress: {}

volumes:
  metadata: {}
